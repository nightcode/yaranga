syntax = "proto3";

package org.nightcode.api;

import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_outer_classname = "ApiProto";
option java_package = "org.nightcode.api.message";

message Status {
  int32                        code    = 1;
  string                       message = 2;
  repeated google.protobuf.Any details = 3;
}

message Trace {
  map<string, string> context = 4;
}

message Metadata {
  int32               generation = 1;
  Trace               trace      = 2;
  map<string, string> tags       = 3;
}

message Request {
  string              service  = 1;
  Metadata            metadata = 2;
  google.protobuf.Any payload  = 3;
}

message Response {
  string                service = 1;
  oneof result {
    Status              error   = 2;
    google.protobuf.Any content = 3;
  }
}
